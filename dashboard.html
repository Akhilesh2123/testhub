<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · Bug Reporting Buddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #111111;
    --muted: #666666;
    --paper: #f5f5f5;
    --surface: #ffffff;
    --line: #d9d9d9;
    --accent: #111111;
    --accent-hover: #333333;
    --on-accent: #ffffff;
    --panel: #111111;
    --panel-text: #fafafa;
    --error: #b42318;
    --focus: #111111;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #f5f5f5;
      --muted: #a3a3a3;
      --paper: #0d0d0d;
      --surface: #181818;
      --line: #2e2e2e;
      --accent: #f5f5f5;
      --accent-hover: #d4d4d4;
      --on-accent: #0d0d0d;
      --panel: #000000;
      --error: #ff8a80;
      --focus: #f5f5f5;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .app { min-height: 100vh; display: grid; grid-template-columns: 250px minmax(0, 1fr); }

  /* Sidebar */
  .side {
    background: var(--panel);
    color: var(--panel-text);
    padding: 28px 16px;
    display: flex;
    flex-direction: column;
    gap: 28px;
    position: sticky;
    top: 0;
    height: 100vh;
  }
  .brand { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 700; font-size: 1.2rem; display: flex; align-items: center; gap: 10px; padding: 0 8px; }
  .brand-mark { width: 26px; height: 26px; border-radius: 8px; background: #fff; position: relative; flex: none; }
  .brand-mark::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: var(--panel); }
  .nav-list { display: flex; flex-direction: column; gap: 4px; }
  .nav {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    width: 100%; padding: 10px 12px; border: 0; border-radius: 10px;
    background: none; color: rgba(250,250,250,.7); cursor: pointer; text-align: left; font-weight: 500;
  }
  .nav:hover { background: rgba(255,255,255,.08); color: #fff; }
  .nav[aria-current="true"] { background: rgba(255,255,255,.14); color: #fff; font-weight: 600; }
  .nav:focus-visible { outline-color: #fff; }
  .count { font-size: .82rem; background: rgba(255,255,255,.12); border-radius: 999px; padding: 0 8px; min-width: 26px; text-align: center; }
  .side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
  .who { display: flex; align-items: center; gap: 10px; padding: 8px 12px; min-width: 0; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: #fff; color: #111; display: grid; place-items: center; font-weight: 700; flex: none; }
  .who-email { font-size: .88rem; color: rgba(250,250,250,.75); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Main */
  .main { padding: 36px clamp(20px, 4vw, 48px) 56px; max-width: 1100px; width: 100%; }
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
  h1 { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: 2rem; line-height: 1.15; margin: 0 0 4px; }
  h2 { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: 1.2rem; margin: 0; }
  .sub { margin: 0; color: var(--muted); }

  .btn {
    height: 44px; padding: 0 18px; border-radius: 10px; border: 1.5px solid transparent;
    font-weight: 600; cursor: pointer; transition: background .15s, border-color .15s;
  }
  .btn-primary { background: var(--accent); color: var(--on-accent); }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-ghost { background: var(--surface); border-color: var(--line); }
  .btn-ghost:hover { border-color: var(--muted); }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 28px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
  .stat-num { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: 2.2rem; font-weight: 700; line-height: 1.1; }
  .stat-label { color: var(--muted); font-size: .92rem; }

  /* Reports list */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 18px 20px; }
  .search { height: 40px; width: min(100%, 260px); padding: 0 12px; background: var(--paper); border: 1.5px solid var(--line); border-radius: 10px; }
  .search:focus-visible { outline: none; border-color: var(--focus); }
  .list { list-style: none; margin: 0; padding: 0; }
  .item { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 14px; align-items: center; padding: 16px 20px; border-top: 1px solid var(--line); }
  .item h3 { margin: 0; font-size: 1rem; font-weight: 600; }
  .item p { margin: 2px 0 0; color: var(--muted); font-size: .92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { font-size: .82rem; color: var(--muted); margin-top: 4px; }

  .badge { font-size: .82rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; border: 1.5px solid var(--ink); white-space: nowrap; }
  .sev-critical { background: var(--ink); color: var(--paper); }
  .sev-high { background: none; color: var(--ink); }
  .sev-medium { background: var(--paper); border-color: var(--line); color: var(--ink); }
  .sev-low { background: none; border-color: var(--line); color: var(--muted); }

  .status { height: 36px; padding: 0 10px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; cursor: pointer; }
  .status:hover { border-color: var(--muted); }
  .del { height: 36px; padding: 0 10px; background: none; border: 0; border-radius: 8px; color: var(--muted); cursor: pointer; font-weight: 500; }
  .del:hover { color: var(--error); background: color-mix(in srgb, var(--error) 10%, transparent); }
  .empty { padding: 40px 20px; text-align: center; color: var(--muted); border-top: 1px solid var(--line); margin: 0; }

  /* Dialog */
  dialog { border: 0; border-radius: 16px; padding: 0; width: min(92vw, 460px); background: var(--surface); color: var(--ink); }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  .dlg-body { padding: 24px; }
  .field { margin-bottom: 16px; }
  label { display: block; font-weight: 600; font-size: .95rem; margin-bottom: 6px; }
  .input { width: 100%; padding: 10px 12px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; }
  .input:focus-visible { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 18%, transparent); }
  textarea.input { min-height: 96px; resize: vertical; }
  .error { color: var(--error); font-size: .88rem; margin: 6px 0 0; }
  .error:empty { display: none; }
  .dlg-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }

  /* Responsive */
  @media (max-width: 900px) {
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; }
    .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 14px 16px; gap: 10px; }
    .nav-list { flex-direction: row; flex-wrap: wrap; order: 3; width: 100%; }
    .nav { width: auto; }
    .side-foot { margin-top: 0; margin-left: auto; flex-direction: row; align-items: center; }
    .who-email { display: none; }
    .side-foot .nav { width: auto; }
  }
  @media (max-width: 640px) {
    .item { display: flex; flex-wrap: wrap; align-items: center; }
    .item-main { flex-basis: 100%; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="brand-mark"></span> Bug Reporting Buddy</div>

    <nav class="nav-list" aria-label="Filter reports">
      <button class="nav" data-filter="all" aria-current="true">All reports <span class="count" id="c-all">0</span></button>
      <button class="nav" data-filter="open">Open <span class="count" id="c-open">0</span></button>
      <button class="nav" data-filter="progress">In progress <span class="count" id="c-progress">0</span></button>
      <button class="nav" data-filter="resolved">Resolved <span class="count" id="c-resolved">0</span></button>
    </nav>

    <div class="side-foot">
      <div class="who">
        <span class="avatar" id="avatar">U</span>
        <span class="who-email" id="who-email"></span>
      </div>
      <button class="nav" id="logout">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <div>
        <h1 id="greeting">Welcome back</h1>
        <p class="sub">Here’s where your bug reports stand today.</p>
      </div>
      <button class="btn btn-primary" id="new-btn">Report a bug</button>
    </header>

    <section class="stats" aria-label="Summary">
      <div class="stat"><div class="stat-num" id="s-open">0</div><div class="stat-label">Open</div></div>
      <div class="stat"><div class="stat-num" id="s-progress">0</div><div class="stat-label">In progress</div></div>
      <div class="stat"><div class="stat-num" id="s-resolved">0</div><div class="stat-label">Resolved</div></div>
      <div class="stat"><div class="stat-num" id="s-critical">0</div><div class="stat-label">Critical and unresolved</div></div>
    </section>

    <section class="card">
      <div class="toolbar">
        <h2 id="list-title">All reports</h2>
        <input class="search" type="search" id="search" placeholder="Search reports" aria-label="Search reports">
      </div>
      <ul class="list" id="list"></ul>
      <p class="empty" id="empty" hidden></p>
    </section>
  </main>
</div>

<dialog id="dlg" aria-labelledby="dlg-title">
  <form id="bug-form" class="dlg-body" novalidate>
    <h2 id="dlg-title" style="margin-bottom:18px">Report a bug</h2>

    <div class="field">
      <label for="f-title">Title</label>
      <input class="input" id="f-title" type="text" placeholder="What went wrong?" maxlength="120">
      <p class="error" id="f-title-error"></p>
    </div>

    <div class="field">
      <label for="f-desc">Steps to reproduce</label>
      <textarea class="input" id="f-desc" placeholder="What did you do, and what happened?"></textarea>
    </div>

    <div class="field">
      <label for="f-sev">Severity</label>
      <select class="input" id="f-sev">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
        <option value="critical">Critical</option>
      </select>
    </div>

    <div class="dlg-actions">
      <button type="button" class="btn btn-ghost" id="cancel">Cancel</button>
      <button type="submit" class="btn btn-primary">Submit report</button>
    </div>
  </form>
</dialog>

<script>
(function () {
  /* Send people back to the login page if they haven't signed in */
  let user = null;
  try { user = sessionStorage.getItem('bbuddy_user'); } catch (e) {}
  if (!user) { window.location.replace('login.html'); return; }

  const STORE_KEY = 'bbuddy_reports';
  const SEVERITY = { critical: 'Critical', high: 'High', medium: 'Medium', low: 'Low' };
  const STATUS = { open: 'Open', progress: 'In progress', resolved: 'Resolved' };
  const TITLES = { all: 'All reports', open: 'Open', progress: 'In progress', resolved: 'Resolved' };

  const $ = (id) => document.getElementById(id);
  let filter = 'all';
  let query = '';

  /* ---------- Data ---------- */
  function daysAgo(n) { return new Date(Date.now() - n * 864e5).toISOString(); }
  function seed() {
    return [
      { id: 'a1', title: 'Checkout button does nothing on Safari', desc: 'Tapping Pay now has no effect on iPhone Safari 17.', severity: 'critical', status: 'open', created: daysAgo(1) },
      { id: 'a2', title: 'Profile photo upload fails above 5 MB', desc: 'Upload spinner never finishes for large images.', severity: 'high', status: 'progress', created: daysAgo(3) },
      { id: 'a3', title: 'Typo on the pricing page', desc: '“Recieve” should be “Receive” in the second paragraph.', severity: 'low', status: 'resolved', created: daysAgo(6) },
      { id: 'a4', title: 'Dark mode hides the search icon', desc: 'The icon is black on a dark background in the header.', severity: 'medium', status: 'open', created: daysAgo(8) }
    ];
  }
  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return seed();
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(reports)); } catch (e) {}
  }
  let reports = load();

  /* ---------- Header / user ---------- */
  let saved = null;
  try { saved = sessionStorage.getItem('bbuddy_name'); } catch (e) {}
  const name = saved || user.split('@')[0].replace(/[._-]+/g, ' ');
  const display = name.charAt(0).toUpperCase() + name.slice(1);
  $('greeting').textContent = 'Welcome back, ' + display;
  $('who-email').textContent = user;
  $('avatar').textContent = display.charAt(0).toUpperCase();

  $('logout').addEventListener('click', () => {
    try {
      sessionStorage.removeItem('bbuddy_user');
      sessionStorage.removeItem('bbuddy_name');
    } catch (e) {}
    window.location.href = 'login.html';
  });

  /* ---------- Rendering ---------- */
  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function row(r) {
    const li = el('li', 'item');

    const main = el('div', 'item-main');
    main.append(el('h3', '', r.title));
    if (r.desc) main.append(el('p', '', r.desc));
    const date = new Date(r.created).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
    main.append(el('div', 'meta', 'Reported ' + date));

    const badge = el('span', 'badge sev-' + r.severity, SEVERITY[r.severity]);

    const select = el('select', 'status');
    select.setAttribute('aria-label', 'Status for ' + r.title);
    Object.keys(STATUS).forEach((key) => {
      const opt = el('option', '', STATUS[key]);
      opt.value = key;
      if (key === r.status) opt.selected = true;
      select.append(opt);
    });
    select.addEventListener('change', () => { r.status = select.value; save(); render(); });

    const del = el('button', 'del', 'Delete');
    del.type = 'button';
    del.setAttribute('aria-label', 'Delete ' + r.title);
    del.addEventListener('click', () => {
      if (confirm('Delete this report?')) {
        reports = reports.filter((x) => x.id !== r.id);
        save(); render();
      }
    });

    li.append(main, badge, select, del);
    return li;
  }

  function render() {
    const count = (s) => reports.filter((r) => r.status === s).length;
    $('c-all').textContent = reports.length;
    $('c-open').textContent = count('open');
    $('c-progress').textContent = count('progress');
    $('c-resolved').textContent = count('resolved');
    $('s-open').textContent = count('open');
    $('s-progress').textContent = count('progress');
    $('s-resolved').textContent = count('resolved');
    $('s-critical').textContent = reports.filter((r) => r.severity === 'critical' && r.status !== 'resolved').length;

    const q = query.trim().toLowerCase();
    const items = reports
      .filter((r) => (filter === 'all' || r.status === filter) && (!q || (r.title + ' ' + r.desc).toLowerCase().includes(q)))
      .sort((a, b) => b.created.localeCompare(a.created));

    $('list').replaceChildren(...items.map(row));
    $('list-title').textContent = TITLES[filter];

    const empty = $('empty');
    empty.hidden = items.length > 0;
    empty.textContent = reports.length === 0
      ? 'No reports yet. Select Report a bug to add your first one.'
      : 'No reports match your filters.';
  }

  /* ---------- Filters and search ---------- */
  document.querySelectorAll('[data-filter]').forEach((btn) => {
    btn.addEventListener('click', () => {
      filter = btn.dataset.filter;
      document.querySelectorAll('[data-filter]').forEach((b) => b.setAttribute('aria-current', String(b === btn)));
      render();
    });
  });
  $('search').addEventListener('input', (e) => { query = e.target.value; render(); });

  /* ---------- New report dialog ---------- */
  const dlg = $('dlg');
  const form = $('bug-form');

  $('new-btn').addEventListener('click', () => {
    form.reset();
    $('f-title-error').textContent = '';
    dlg.showModal();
    $('f-title').focus();
  });
  $('cancel').addEventListener('click', () => dlg.close());
  dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const title = $('f-title').value.trim();
    if (!title) {
      $('f-title-error').textContent = 'Enter a title for the bug.';
      $('f-title').focus();
      return;
    }
    reports.push({
      id: Date.now().toString(36),
      title: title,
      desc: $('f-desc').value.trim(),
      severity: $('f-sev').value,
      status: 'open',
      created: new Date().toISOString()
    });
    save();
    dlg.close();
    render();
  });

  render();
})();
</script>
</body>
</html>
