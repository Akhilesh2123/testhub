<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account · Bug Reporting Buddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
</head>
<body>
<div class="layout">
  <aside class="panel" aria-hidden="true">
    <div class="brand"><span class="brand-mark"></span> Bug Reporting Buddy</div>
    <div>
      <h2>Start squashing bugs today.</h2>
      <p>Create an account to log, track and close bugs in one place.</p>
    </div>
  </aside>

  <main class="main">
    <div class="card">
      <div class="brand mobile-brand"><span class="brand-mark"></span> Bug Reporting Buddy</div>

      <h1>Create your account</h1>
      <p class="sub">Already have one? <a href="login.html">Sign in</a></p>

      <div class="alert" id="form-alert" role="alert"></div>

      <form id="signup-form" novalidate>
        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" autocomplete="name" placeholder="Alex Morgan" aria-describedby="name-error">
          <p class="error" id="name-error"></p>
        </div>

        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" autocomplete="email" inputmode="email" placeholder="you@example.com" aria-describedby="email-error">
          <p class="error" id="email-error"></p>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="control has-toggle">
            <input type="password" id="password" autocomplete="new-password" placeholder="At least 8 characters" aria-describedby="password-error">
            <button type="button" class="toggle" data-target="password" aria-controls="password" aria-pressed="false">Show</button>
          </div>
          <div class="meter" id="meter" data-level="0" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
          <p class="meter-text" id="meter-text" aria-live="polite"></p>
          <p class="error" id="password-error"></p>
        </div>

        <div class="field">
          <label for="confirm">Confirm password</label>
          <div class="control has-toggle">
            <input type="password" id="confirm" autocomplete="new-password" placeholder="Re-enter your password" aria-describedby="confirm-error">
            <button type="button" class="toggle" data-target="confirm" aria-controls="confirm" aria-pressed="false">Show</button>
          </div>
          <p class="error" id="confirm-error"></p>
        </div>

        <div class="field">
          <label class="check"><input type="checkbox" id="terms" aria-describedby="terms-error"> <span>I agree to the <a href="#terms">Terms of Service</a> and <a href="#privacy">Privacy Policy</a></span></label>
          <p class="error" id="terms-error"></p>
        </div>

        <button type="submit" class="btn btn-primary" id="submit">
          <span class="spinner" aria-hidden="true"></span>
          <span class="label">Create account</span>
        </button>
      </form>

      <div class="divider">or</div>

      <button type="button" class="btn btn-outline" id="google">
        <span class="spinner" aria-hidden="true"></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.5 12.2c0-.8-.1-1.5-.2-2.2H12v4.3h5.9a5 5 0 0 1-2.2 3.3v2.7h3.5c2.1-1.9 3.3-4.7 3.3-8.1z"/><path fill="#34A853" d="M12 23c3 0 5.4-1 7.2-2.7l-3.5-2.7c-1 .7-2.2 1-3.7 1-2.8 0-5.2-1.9-6-4.5H2.4v2.8A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M6 14.1a6.6 6.6 0 0 1 0-4.2V7.1H2.4a11 11 0 0 0 0 9.8L6 14.1z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3 .6 4.2 1.6l3.1-3.1A11 11 0 0 0 2.4 7.1L6 9.9c.8-2.6 3.2-4.5 6-4.5z"/></svg>
        <span class="label">Sign up with Google</span>
      </button>
    </div>
  </main>
</div>

<script src="auth.js"></script>
<script>
(function () {
  const A = window.Auth;
  const name = A.$('name');
  const email = A.$('email');
  const password = A.$('password');
  const confirm = A.$('confirm');
  const terms = A.$('terms');
  const submit = A.$('submit');

  const checkName = () => A.checkRequired(name, 'Enter your full name.');
  const checkEmail = () => A.checkEmail(email);
  const checkPassword = () => A.checkPassword(password, 'Choose a password.');
  const checkConfirm = () => A.checkConfirm(confirm, password);
  const checkTerms = () => A.setError(terms, terms.checked ? '' : 'Agree to the terms to create an account.');

  A.live(name, checkName);
  A.live(email, checkEmail);
  A.live(password, () => { checkPassword(); if (confirm.value) checkConfirm(); });
  A.live(confirm, checkConfirm);
  terms.addEventListener('change', checkTerms);
  A.wireMeter(password, A.$('meter'), A.$('meter-text'));

  A.$('signup-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    A.hideAlert();

    const checks = [[checkName, name], [checkEmail, email], [checkPassword, password], [checkConfirm, confirm], [checkTerms, terms]];
    let firstBad = null;
    checks.forEach(([fn, input]) => { if (!fn() && !firstBad) firstBad = input; });
    if (firstBad) return firstBad.focus();

    A.setLoading(submit, true, 'Creating account…');
    try {
      /* ---- Replace with your real API call ----
      const res = await fetch('/api/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name.value.trim(), email: email.value.trim(), password: password.value })
      });
      if (res.status === 409) throw new Error('exists');
      if (!res.ok) throw new Error('failed');
      ------------------------------------------ */
      await new Promise((r) => setTimeout(r, 1000)); // demo delay
      A.signIn(email.value.trim(), name.value.trim());
    } catch (err) {
      A.setLoading(submit, false);
      A.showAlert(err.message === 'exists'
        ? 'An account with this email already exists. Sign in instead.'
        : 'We couldn’t create your account. Try again in a moment.');
    }
  });
})();
</script>
</body>
</html>
